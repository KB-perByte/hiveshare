version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hiveshare
      POSTGRES_PASSWORD: hiveshare
      POSTGRES_DB: hiveshare
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiveshare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  hiveshare:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: "postgres://hiveshare:hiveshare@postgres:5432/hiveshare?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      LISTEN_ADDR: ":8080"
      EMBED_PROVIDER: "${EMBED_PROVIDER:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
      SA_TOKEN_TTL_MINUTES: "${SA_TOKEN_TTL_MINUTES:-15}"
      BASE_URL: "${BASE_URL:-http://localhost:8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    # profile: server lets `docker compose up -d` (infra only) still work without the server.
    # Use `docker compose --profile server up -d` or dev-local.sh to include it.
    profiles: ["server"]

volumes:
  postgres_data:
