apiVersion: v1
kind: Secret
metadata:
  name: hiveshare-env
  namespace: hiveshare
type: Opaque
stringData:
  DATABASE_URL: "postgres://hiveshare:CHANGE_ME@postgres:5432/hiveshare?sslmode=disable"
  REDIS_URL: "redis://redis:6379"
  BASE_URL: "https://hiveshare-hiveshare.apps.YOUR_CLUSTER_DOMAIN"
  LISTEN_ADDR: ":8080"
  EMBED_PROVIDER: "openai"
  OPENAI_API_KEY: "sk-CHANGE_ME"
